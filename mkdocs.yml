site_name: Takprog Archive
site_description: Nezvanična arhiva zadataka i rešenja sa srpskih srednjoškolskih takmičenja iz informatike.

theme:

  name: material 
  language: sh
  logo: assets/images/takprog-archive.svg
  favicon: assets/images/takprog-archive.svg
  font:
    text: Ubuntu
    code: Roboto Mono
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow
    - content.code.copy
  custom_dir: overrides
  
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 

extra_javascript:
  - javascript/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css: 
  - stylesheets/style.css

plugins:
  - search
  - literate-nav:
      nav_file: nav.md
      tab_length: 2
